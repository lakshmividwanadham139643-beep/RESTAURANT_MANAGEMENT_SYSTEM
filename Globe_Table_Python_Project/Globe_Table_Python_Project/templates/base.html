<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Globe Table</title><style>body{font:15px Arial;background:#faf5ec;color:#24201c;margin:0}header,footer{background:#211d1a;color:white;padding:18px max(20px,calc((100% - 1100px)/2))}header a{color:#f0a77d;text-decoration:none;margin-right:16px}main{max-width:1100px;margin:auto;padding:30px 20px}.card{background:#fffdf8;border:1px solid #e8ddce;border-radius:16px;padding:18px;margin:14px 0}button,.btn{padding:9px 14px;border:0;border-radius:20px;background:#d65a35;color:white;cursor:pointer;text-decoration:none}input,select{padding:8px;border:1px solid #ddd;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.flash{padding:10px;background:#e6f5ec}.error{background:#ffe9e5}.muted{color:#776d62}</style></head><body><header><a href="/">Globe Table</a><a href="/my-orders">My Orders</a>{% if current_role=='admin' %}<a href="/admin">Admin</a>{% endif %}<a href="/">Home</a></header><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p class="flash {{category}}">{{message}}</p>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>Globe Table · Python + Flask + SQLite</footer></body></html>
